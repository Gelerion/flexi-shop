openapi: 3.1.1
info:
  title: FlexiShop Product Service API
  version: '1.0.0'
  description: API specification for FlexiShop's Product Service, incorporating best practices for pagination, error handling, and resource modeling. Uses individual query parameters for filtering to ensure specific URL format.
servers:
  - url: https://api.flexishop.com/v1
    description: Production server
  - url: http://localhost:8080/v1
    description: Development server
paths:
  /products:
    get:
      tags:
        - Products
      summary: Retrieve a list of products
      description: Fetch a paginated list of products with support for filtering, sorting, projection, and inclusion of related resources using individual query parameters.
      operationId: listProducts
      parameters:
        - $ref: '#/components/parameters/ProductFilterParam'
        - $ref: '#/components/parameters/IncludeParam'
        - $ref: '#/components/parameters/PageableParam'
      responses:
        '200':
          description: A paginated list of products.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Products
      summary: Create a new product
      operationId: createProduct
      requestBody:
        description: Product data for creation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created successfully.
          headers:
            Location:
              description: URL of the created product.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductIdParam'
    get:
      tags:
        - Products
      summary: Retrieve a product by ID
      description: Fetch a single product by its UUID, with optional inclusion of related resources and field projection.
      operationId: getProductById
      parameters:
        - $ref: '#/components/parameters/IncludeParam'
      responses:
        '200':
          description: Product details. The included related resources depend on the 'include' parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Products
      summary: Partially update an existing product
      description: Update one or more fields of an existing product. Only the fields provided in the request body will be updated. Send `null` for nullable fields to explicitly clear them (e.g., brandId).
      operationId: updateProduct
      requestBody:
        description: Fields to update in the product. All fields are optional.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      responses:
        '200':
          description: Product updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Products
      summary: Delete a product
      operationId: deleteProduct
      responses:
        '204':
          description: Product deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /products/{productId}/tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/ProductIdParam'
      - $ref: '#/components/parameters/TagIdParam'
    put:
      tags:
        - Products
      summary: Assign an existing tag to a product
      description: Associates an existing tag (identified by tagId) with the specified product. Fails if the tag does not exist. This operation is idempotent.
      operationId: addProductTag
      responses:
        '204':
          description: Tag successfully assigned to the product.
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: Not Found - Either the Product or the Tag could not be found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                productNotFound:
                  summary: Product Not Found
                  value:
                    type: '/probs/not-found'
                    title: 'Resource Not Found'
                    status: 404
                    detail: 'The product with the specified ID does not exist.'
                    instance: '/products/123e4567-e89b-12d3-a456-000000000000/tags/1'
                tagNotFound:
                  summary: Tag Not Found
                  value:
                    type: '/probs/not-found'
                    title: 'Resource Not Found'
                    status: 404
                    detail: 'The tag with the specified ID does not exist.'
                    instance: '/products/123e4567-e89b-12d3-a456-426614174000/tags/999'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Products
      summary: Remove a tag from a product
      description: Removes the association between a tag (identified by tagId) and a product.
      operationId: deleteProductTag
      responses:
        '204':
          description: Tag successfully removed from the product.
        '404':
          description: Not Found - Either the Product was not found, or the Tag was not associated with the Product.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              examples:
                productNotFound:
                  summary: Product Not Found
                  value:
                    type: '/probs/not-found'
                    title: 'Resource Not Found'
                    status: 404
                    detail: 'The product with the specified ID does not exist.'
                    instance: '/products/123e4567-e89b-12d3-a456-000000000000/tags/1'
                tagNotAssociated:
                  summary: Tag Not Associated With Product
                  value:
                    type: '/probs/not-found'
                    title: 'Resource Not Found'
                    status: 404
                    detail: 'The tag with ID 999 is not associated with product 123e4567-e89b-12d3-a456-426614174000.'
                    instance: '/products/123e4567-e89b-12d3-a456-426614174000/tags/999'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /brands:
    get:
      tags:
        - Brands
      summary: Retrieve a list of brands
      operationId: listBrands
      parameters:
        - $ref: '#/components/parameters/PageableParam'
      responses:
        '200':
          description: A paginated list of brands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandPage'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Brands
      summary: Create a new brand
      operationId: createBrand
      requestBody:
        description: Brand data for creation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrandCreateRequest'
      responses:
        '201':
          description: Brand created successfully.
          headers:
            Location:
              description: URL of the created brand.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /brands/{brandId}:
    parameters:
      - $ref: '#/components/parameters/BrandIdParam'
    get:
      tags:
        - Brands
      summary: Retrieve a brand by ID
      operationId: getBrandById
      responses:
        '200':
          description: Brand details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories:
    get:
      tags:
        - Categories
      summary: Retrieve a list of categories
      operationId: listCategories
      parameters:
        - $ref: '#/components/parameters/PageableParam'
      responses:
        '200':
          description: A paginated list of categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Categories
      summary: Create a new category
      operationId: createCategory
      requestBody:
        description: Category data for creation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreateRequest'
      responses:
        '201':
          description: Category created successfully.
          headers:
            Location:
              description: URL of the created category.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryIdParam'
    get:
      tags:
        - Categories
      summary: Retrieve a category by ID
      operationId: getCategoryById
      responses:
        '200':
          description: Category details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tags:
    get:
      tags:
        - Tags
      summary: Retrieve a list of tags
      operationId: listTags
      parameters:
        - $ref: '#/components/parameters/PageableParam'
      responses:
        '200':
          description: A paginated list of tags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagPage'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Tags
      summary: Create a new tag
      operationId: createTag
      requestBody:
        description: Tag data for creation.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagCreateRequest'
      responses:
        '201':
          description: Tag created successfully.
          headers:
            Location:
              description: URL of the created tag.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tags/{tagId}:
    parameters:
      - $ref: '#/components/parameters/TagIdParam'
    get:
      tags:
        - Tags
      summary: Retrieve a tag by ID
      operationId: getTagById
      responses:
        '200':
          description: Tag details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResource'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - Tags
      summary: Update an existing tag (Full Replacement)
      description: Replaces the entire tag resource with the provided data. If optional fields are omitted, they are removed or set to default.
      operationId: updateTag
      requestBody:
        description: Updated tag data.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagUpdateRequest'
      responses:
        '200':
          description: Tag updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagResource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - Tags
      summary: Delete a tag
      operationId: deleteTag
      responses:
        '204':
          description: Tag deleted successfully.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    ProductIdParam:
      name: productId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: The UUID identifier of the product.
      example: '123e4567-e89b-12d3-a456-426614174000'
    BrandIdParam:
      name: brandId
      in: path
      required: true
      schema:
        type: integer
      description: The identifier of the brand.
      example: 101
    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
      description: The identifier of the category.
      example: 20
    TagIdParam:
      name: tagId
      in: path
      required: true
      schema:
        type: integer
      description: The identifier of the tag.
      example: 5

    PageableParam:
      in: query
      name: pageable
      description: Paging and sorting options. Encoded as individual query parameters (e.g., `page=0&size=20&sort=name,asc`).
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/Pageable'

    ProductFilterParam:
      in: query
      name: filter
      description: >
        Flexible product filters; each inner field becomes its own query
        parameter (e.g., `q=mouse&brand=Logitech&price=gte:10`).
      required: false
      style: form
      explode: true
      schema:
        $ref: '#/components/schemas/ProductFilterCriteria'

    IncludeParam:
      name: include
      in: query
      description: >
        Comma-separated list of related resources to include in the response.
        Possible values defined in the 'ProductIncludeOption' enum.
        Example: `include=brand,tags`
      required: false
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ProductIncludeOption'
        example: [ brand, tags ]
      style: form
      explode: false
      example: "brand,tags"

  schemas:
    Pageable:
      type: object
      description: >
        Schema defining pagination and sorting properties. Used by `PageableParam`
        with `style: form, explode: true` to generate individual query parameters
        like `page=0&size=20&sort=name,asc&sort=price,desc`.
      properties:
        page:
          type: integer
          minimum: 0
          default: 0
          description: Page number of the requested page (0‑indexed).
          example: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
          description: Size of the requested page (number of items).
          example: 20
        sort:
          type: array
          items:
            type: string
            pattern: '^[a-zA-Z0-9_.]+(,(asc|desc))?$'
            description: "Sorting criteria: `property` or `property,(asc|desc)`. Default direction is 'asc'."
          description: >
            Sorting criteria. Repeat the `sort` parameter for multiple criteria:
            `sort=name,asc&sort=price,desc`. If direction is omitted, 'asc' is assumed.
          example: [ "name,asc", "price,desc" ]
      additionalProperties: false

    ProductFilterCriteria:
      type: object
      description: >
        Schema defining filter properties. Used by `ProductFilterParam`
        with `style: form, explode: true` to generate individual query parameters
        like `q=mouse&brand=Logitech&price=gte:10&price=lte:50`.
      properties:
        q:
          type: string
          description: Full‑text search query string across relevant fields.
          example: gaming mouse
        brand:
          type: array
          items: { type: string }
          description: >
            Filters by one or more brand names. Encoded as repeated parameter
            (e.g.,`brand=Logitech&brand=Razer`).
          example: [ Logitech, Razer ]
        price:
          type: array
          items:
            type: string
            pattern: '^(eq|gt|lt|gte|lte):\d+(\.\d+)?$'
          maxItems: 2
          description: |
            Filter by price range using `operator:value` (e.g.,`gte:10`,`lte:50`).
            Supported operators: `eq`,`gt`,`lt`,`gte`,`lte`.
            Repeat parameter for range: `price=gte:10&price=lte:50`.
          example: [ gte:10, lte:50 ]
        rating:
          type: array
          items:
            type: string
            pattern: '^(eq|gt|lt|gte|lte):\d+$'
            examples: [ gte:4, lte:5 ]
          maxItems: 2
          description: |
            Filter by rating range using `operator:value` (e.g `gte:4`).
            Supported operators: `eq`,`gt`,`lt`,`gte`,`lte`.
            Repeat parameter for range: `rating=gte:4&rating=lte:5`.
          example: [ gte:4 ]
        status:
          type: string
          description: Filter by product status.
          enum: [ active, inactive, discontinued ]
          example: active
        inventoryQuantity:
          type: string
          pattern: '^(eq|gt|lt|gte|lte):\d+$'
          description: Filter by inventory quantity using operator:value (e.g., `inventoryQuantity=gte:100`).
          example: "gte:100"
        name:
          type: string
          description: Filter by product name (exact match assumed, server might implement case-insensitivity or partial matching).
          example: "Ergonomic Keyboard"
        "product[category]":
          type: array
          items: { type: string }
          description: >
            Filters by one or more product category names. Repeat parameter
            (e.g., `product[category]=Electronics&product[category]=Accessories`).
          example: [ Electronics, Accessories ]
        "product[tag]":
          type: array
          items: { type: string }
          description: >
            Filters by one or more product tag names. Repeat parameter
            (e.g., `product[tag]=wireless&product[tag]=ergonomic`).
          example: [ wireless, ergonomic ]
      additionalProperties: false

    ProductIncludeOption:
      type: string
      description: One of the related resource names you can include.
      enum:
        - brand
        - tags
        - categories
        - images
        - specifications
      example: brand

    ProductResource:
      type: object
      description: Represents a product, potentially including related resources based on the 'include' parameter.
      required:
        - id
        - name
        - description
        - price
        - status
        - inventoryQuantity
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          description: Unique identifier for the product.
          example: '123e4567-e89b-12d3-a456-426614174000'
        name:
          type: string
          maxLength: 255
          description: Name of the product.
          example: 'Wireless Mouse'
        description:
          type: string
          description: Detailed description of the product.
          example: 'A high-quality wireless mouse with ergonomic design.'
        price:
          type: number
          format: float
          minimum: 0.0
          description: Price of the product.
          example: 29.99
        status:
          type: string
          enum: [active, inactive, discontinued]
          default: active
          description: Current status of the product.
          example: 'active'
        inventoryQuantity:
          type: integer
          minimum: 0
          default: 0
          description: Quantity currently in stock.
          example: 150
        createdAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the product was created.
          example: '2023-10-01T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          description: Timestamp when the product was last updated.
          example: '2023-10-02T15:30:00Z'
        brand:
          $ref: '#/components/schemas/BrandResource'
          description: Brand details (included if 'brand' is specified in 'include' parameter).
          readOnly: true
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryResource'
          description: List of categories (included if 'categories' is specified in 'include' parameter).
          readOnly: true
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagResource'
          description: List of tags (included if 'tags' is specified in 'include' parameter).
          readOnly: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/ImageResource'
          description: List of product images (included if 'images' is specified in 'include' parameter).
          readOnly: true
        specifications:
          type: array
          items:
            $ref: '#/components/schemas/SpecificationResource'
          description: List of product specifications (included if 'specifications' is specified in 'include' parameter).
          readOnly: true
      example:
        id: '123e4567-e89b-12d3-a456-426614174000'
        name: 'Wireless Mouse'
        description: 'A high-quality wireless mouse with ergonomic design.'
        price: 29.99
        status: 'active'
        inventoryQuantity: 150
        createdAt: '2023-10-01T12:00:00Z'
        updatedAt: '2023-10-02T15:30:00Z'

    BrandResource:
      type: object
      description: Represents a brand.
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          readOnly: true
          example: 101
        name:
          type: string
          maxLength: 255
          example: 'Logitech'
        description:
          type: [ 'string', 'null' ]
          description: Optional description of the brand.
          example: 'A leading manufacturer of computer peripherals.'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-01-15T10:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-01-15T10:00:00Z'
      example:
        id: 101
        name: 'Logitech'
        description: 'A leading manufacturer of computer peripherals.'
        createdAt: '2023-01-15T10:00:00Z'
        updatedAt: '2023-01-15T10:00:00Z'

    CategoryResource:
      type: object
      description: Represents a product category.
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          readOnly: true
          example: 20
        name:
          type: string
          maxLength: 255
          example: 'Electronics'
        parentId:
          type: [ 'integer', 'null' ]
          description: The ID of the parent category, or null if it's a top-level category.
          example: 1
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-01-20T11:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-01-20T11:00:00Z'
      example:
        id: 21
        name: 'Peripherals'
        parentId: 20
        createdAt: '2023-01-21T12:00:00Z'
        updatedAt: '2023-01-21T12:00:00Z'

    TagResource:
      type: object
      description: Represents a tag that can be applied to products.
      required:
        - id
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          readOnly: true
          example: 5
        name:
          type: string
          maxLength: 255
          example: 'wireless'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-02-10T09:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-02-10T09:00:00Z'
      example:
        id: 5
        name: 'wireless'
        createdAt: '2023-02-10T09:00:00Z'
        updatedAt: '2023-02-10T09:00:00Z'

    ImageResource:
      type: object
      description: Represents an image associated with a product.
      required:
        - id
        - imageUrl
        - isPrimary
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          readOnly: true
          example: 301
        imageUrl:
          type: string
          format: uri
          example: 'https://cdn.flexishop.com/images/mouse_primary.jpg'
        altText:
          type: [ 'string', 'null' ]
          description: Optional alternative text for the image.
          example: 'Side view of the wireless mouse'
        isPrimary:
          type: boolean
          default: false
          example: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-10-01T13:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-10-01T13:00:00Z'
      example:
        id: 301
        imageUrl: 'https://cdn.flexishop.com/images/mouse_primary.jpg'
        altText: 'Side view of the wireless mouse'
        isPrimary: true
        createdAt: '2023-10-01T13:00:00Z'
        updatedAt: '2023-10-01T13:00:00Z'

    SpecificationResource:
      type: object
      description: Represents a specific technical detail or feature of a product.
      required:
        - id
        - name
        - value
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
          readOnly: true
          example: 45
        name:
          type: string
          maxLength: 255
          example: 'Battery Life'
        value:
          type: string
          maxLength: 255
          example: 'Up to 12 months'
        createdAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-10-01T14:00:00Z'
        updatedAt:
          type: string
          format: date-time
          readOnly: true
          example: '2023-10-01T14:00:00Z'
      example:
        id: 45
        name: 'Battery Life'
        value: 'Up to 12 months'
        createdAt: '2023-10-01T14:00:00Z'
        updatedAt: '2023-10-01T14:00:00Z'

    ProductCreateRequest:
      type: object
      description: Data required to create a new product.
      required:
        - name
        - description
        - price
      properties:
        name:
          type: string
          maxLength: 255
          example: 'Ergonomic Keyboard'
        description:
          type: string
          example: 'A comfortable keyboard designed for long typing sessions.'
        price:
          type: number
          format: float
          minimum: 0.0
          example: 79.95
        status:
          type: string
          enum: [ active, inactive, discontinued ]
          default: active
          example: 'active'
        inventoryQuantity:
          type: integer
          minimum: 0
          default: 0
          example: 50
        brandId:
          type: integer
          description: ID of the existing brand to associate.
          example: 101
        categoryIds:
          type: array
          items:
            type: integer
          description: List of existing category IDs to associate.
          example: [ 21, 25 ]
        tagIds:
          type: array
          items:
            type: integer
          description: List of existing tag IDs to associate.
          example: [ 6, 8 ]
      example:
        name: 'Ergonomic Keyboard'
        description: 'A comfortable keyboard designed for long typing sessions.'
        price: 79.95
        status: 'active'
        inventoryQuantity: 50
        brandId: 101
        categoryIds: [ 21, 25 ]
        tagIds: [ 6, 8 ]

    ProductUpdateRequest:
      type: object
      description: Fields to partially update for an existing product. All fields are optional. Send `null` for nullable fields like `brandId` to explicitly clear them.
      properties:
        name:
          type: string
          maxLength: 255
          example: 'Ergonomic Keyboard Pro'
        description:
          type: string
          example: 'An updated description for the pro version with backlit keys.'
        price:
          type: number
          format: float
          minimum: 0.0
          example: 89.95
        status:
          type: string
          enum: [ active, inactive, discontinued ]
          example: 'active'
        inventoryQuantity:
          type: integer
          minimum: 0
          example: 75
        brandId:
          type: [ 'integer', 'null' ]
          description: "ID of the brand to associate. Send `null` to remove the association."
          example: null
        categoryIds:
          type: array
          items:
            type: integer
          description: Replace the list of associated category IDs. Send empty array `[]` to remove all.
          example: [ 21 ]
        tagIds:
          type: array
          items:
            type: integer
          description: Replace the list of associated tag IDs. Send empty array `[]` to remove all.
          example: [ 6, 8, 10 ]
      example:
        description: 'An updated description for the pro version with backlit keys.'
        price: 89.95
        inventoryQuantity: 75
        brandId: null
        tagIds: [ 6, 8, 10 ]

    BrandCreateRequest:
      type: object
      description: Data required to create a new brand.
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: 'FlexiBrand'
        description:
          type: [ 'string', 'null' ]
          example: 'Our own brand of quality accessories.'
      example:
        name: 'FlexiBrand'
        description: 'Our own brand of quality accessories.'

    CategoryCreateRequest:
      type: object
      description: Data required to create a new category.
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: 'Monitors'
        parentCategoryId:
          type: [ 'integer', 'null' ]
          description: ID of the parent category, or null for a top-level category.
          example: 20
      example:
        name: 'Monitors'
        parentCategoryId: 20

    TagCreateRequest:
      type: object
      description: Data required to create a new tag.
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: 'gaming'
      example:
        name: 'gaming'

    TagUpdateRequest:
      type: object
      description: Data required to fully update a tag (currently only name is updatable).
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 255
          example: 'high-performance-gaming'
      example:
        name: 'high-performance-gaming'

    PageInfo:
      type: object
      description: Metadata associated with a paginated response, mirroring Spring Data Page structure.
      properties:
        totalPages:
          type: integer
          readOnly: true
          example: 10
        totalElements:
          type: integer
          format: int64
          readOnly: true
          example: 195
        size:
          type: integer
          readOnly: true
          description: The number of items requested per page.
          example: 20
        number:
          type: integer
          readOnly: true
          description: The page number (0-indexed) returned.
          example: 0
        numberOfElements:
          type: integer
          readOnly: true
          description: The number of items in the current page.
          example: 20
        first:
          type: boolean
          readOnly: true
          example: true
        last:
          type: boolean
          readOnly: true
          example: false
        empty:
          type: boolean
          readOnly: true
          example: false
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortOrderInfo'
          readOnly: true
          example:
            - property: 'name'
              direction: 'asc'
              ignoreCase: false
              nullHandling: 'native'
      required:
        - totalPages
        - totalElements
        - size
        - number
        - empty
      example:
        totalPages: 10
        totalElements: 195
        size: 20
        number: 0
        numberOfElements: 20
        first: true
        last: false
        empty: false
        sort:
          - property: 'name'
            direction: 'asc'
            ignoreCase: false
            nullHandling: 'native'

    SortOrderInfo:
      type: object
      description: Details of a single sort criterion applied to the query, mirroring Spring Data Sort structure.
      properties:
        property:
          type: string
          readOnly: true
          example: 'name'
        direction:
          type: string
          enum: [ asc, desc ]
          readOnly: true
          example: 'asc'
        ignoreCase:
          type: boolean
          readOnly: true
          example: false
        nullHandling:
          type: string
          enum: [ native, nulls_first, nulls_last ]
          readOnly: true
          example: 'native'
      required:
        - property
        - direction
        - ignoreCase
        - nullHandling

