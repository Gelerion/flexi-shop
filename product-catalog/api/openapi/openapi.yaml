    ProblemDetail:
      type: object
      description: A machine-readable format for specifying errors in HTTP API responses based on RFC 7807.
      properties:
        type:
          type: string
          format: uri
          default: 'about:blank'
          description: An absolute URI that identifies the problem type.
          example: '/probs/validation-error'
        title:
          type: string
          description: A short, human-readable summary of the problem type.
          example: 'Validation Error'
        status:
          type: integer
          format: int32
          minimum: 100
          maximum: 599
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          example: 400
        detail:
          type: string
          description: A human-readable explanation specific to this occurrence of the problem.
          example: 'Request validation failed.'
        instance:
          type: string
          format: uri-reference
          description: A URI reference that identifies the specific resource associated with this occurrence of the problem.
          example: '/products'
        invalidParams:
          type: array
          items:
            $ref: '#/components/schemas/InvalidParam'
          description: An array of objects detailing validation errors. Only present for validation-related problems.
          example:
            - name: 'name'
              reason: 'size must be between 1 and 255'
            - name: 'price'
              reason: 'must be greater than or equal to 0'
      required:
        - type
        - title
        - status
      example:
        type: '/probs/validation-error'
        title: 'Validation Error'
        status: 400
        detail: 'Request validation failed.'
        instance: '/products'
        invalidParams:
          - name: 'name'
            reason: 'size must be between 1 and 255'
          - name: 'price'
            reason: 'must be greater than or equal to 0'


    InvalidParam:
      type: object
      description: Represents a single validation error detail.
      properties:
        name:
          type: string
          description: The name of the invalid parameter or field.
          example: 'price'
        reason:
          type: string
          description: The reason why the parameter is invalid.
          example: 'must be greater than or equal to 0'
      required:
        - name
        - reason

  responses:
    BadRequest:
      description: Bad Request - The request syntax is malformed, contains invalid parameters, or is otherwise invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            validationError:
              summary: Validation Error
              value:
                type: '/probs/validation-error'
                title: 'Validation Error'
                status: 400
                detail: 'Request validation failed.'
                instance: '/products'
                invalidParams:
                  - name: 'name'
                    reason: 'size must be between 1 and 255'
                  - name: 'price'
                    reason: 'must be greater than or equal to 0'
            invalidQueryParam:
              summary: Invalid Query Parameter Format
              value:
                type: '/probs/invalid-parameter'
                title: 'Invalid Parameter'
                status: 400
                detail: "Invalid format for parameter 'price'. Expected 'operator:value'."
                instance: '/products?price=abc'
    Unauthorized:
      description: Unauthorized - Authentication credentials are required and are missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            missingCredentials:
              summary: Missing Credentials
              value:
                type: '/probs/unauthorized'
                title: 'Unauthorized'
                status: 401
                detail: 'Valid authentication credentials are required to access this resource.'
            invalidToken:
              summary: Invalid Token
              value:
                type: '/probs/unauthorized'
                title: 'Unauthorized'
                status: 401
                detail: 'Authentication token is invalid or expired.'
    Forbidden:
      description: Forbidden - The authenticated user does not have permission to perform the requested operation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            insufficientPermissions:
              summary: Insufficient Permissions
              value:
                type: '/probs/forbidden'
                title: 'Forbidden'
                status: 403
                detail: 'You do not have sufficient permissions to create a product.'
                instance: '/products'
    NotFound:
      description: Not Found - The requested resource could not be found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            productNotFound:
              summary: Product Not Found
              value:
                type: '/probs/not-found'
                title: 'Resource Not Found'
                status: 404
                detail: 'The product with the specified ID does not exist.'
                instance: '/products/123e4567-e89b-12d3-a456-000000000000'
            brandNotFound:
              summary: Brand Not Found
              value:
                type: '/probs/not-found'
                title: 'Resource Not Found'
                status: 404
                detail: 'The brand with the specified ID does not exist.'
                instance: '/brands/9999'
            genericNotFound:
              summary: Generic Not Found
              value:
                type: '/probs/not-found'
                title: 'Resource Not Found'
                status: 404
                detail: 'The requested resource could not be found.'
                instance: '/some/unknown/path'
    Conflict:
      description: Conflict - The request could not be completed due to a conflict with the current state of the resource.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            duplicateTag:
              summary: Duplicate Tag Name
              value:
                type: '/probs/conflict/duplicate-resource'
                title: 'Conflict'
                status: 409
                detail: 'A tag with the name "wireless" already exists.'
                instance: '/tags'
            deleteConflict:
              summary: Deletion Conflict (Resource In Use)
              value:
                type: '/probs/conflict/resource-in-use'
                title: 'Conflict'
                status: 409
                detail: 'Cannot delete tag with ID 5 because it is currently associated with one or more products.'
                instance: '/tags/5'
    UnprocessableEntity:
      description: Unprocessable Entity - The request was well-formed but contained semantic errors (business logic validation).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            semanticError:
              summary: Business Logic Error
              value:
                type: '/probs/unprocessable-entity'
                title: 'Unprocessable Entity'
                status: 422
                detail: 'Cannot assign a discontinued category to an active product.'
                instance: '/products/123e4567-e89b-12d3-a456-426614174000'
    InternalServerError:
      description: Internal Server Error - An unexpected error occurred on the server.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
          examples:
            unexpectedError:
              summary: Unexpected Server Error
              value:
                type: '/probs/internal-server-error'
                title: 'Internal Server Error'
                status: 500
                detail: 'An unexpected error occurred while processing the request. Please try again later or contact support if the problem persists.'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Authentication using a JSON Web Token (JWT) provided in the Authorization header (e.g., `Authorization: Bearer <token>`)."

security:
  - BearerAuth: [ ]